<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <title>FinPilot Budget Guard</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>FinPilot Budget Guard</h1>

      <section aria-labelledby="budget-heading">
        <h2 id="budget-heading">This month</h2>
        <p id="status" role="status">Loading…</p>
        <dl id="budget-figures" hidden>
          <dt>Discretionary left</dt>
          <dd id="discretionary">—</dd>
          <dt>Safe to spend per day</dt>
          <dd id="safe-daily">—</dd>
          <dt>As of</dt>
          <dd id="as-of">—</dd>
        </dl>
        <button id="refresh" type="button">Refresh now</button>
      </section>

      <section aria-labelledby="cooldown-heading">
        <h2 id="cooldown-heading">Paused purchases</h2>
        <ul id="cooldown-list"><li id="cooldown-empty">None yet.</li></ul>
      </section>

      <section aria-labelledby="settings-heading">
        <h2 id="settings-heading">API</h2>
        <label for="api-select">FinPilot API</label>
        <select id="api-select">
          <option value="https://finpilot-w4ki.onrender.com">Production</option>
          <option value="http://localhost:8001">Local (localhost:8001)</option>
        </select>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
