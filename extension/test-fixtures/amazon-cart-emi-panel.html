<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>Mock Amazon Cart, EMI Panel Near Checkout</title></head>
  <body>
    <!-- Reproduces a real false positive: an EMI financing panel sitting
         right next to the checkout button, quoting a total repayment figure
         (₹5,93,990) far larger than the actual order total (₹32,310). The
         old "biggest ₹ figure near a checkout-shaped button" rule picked the
         EMI figure. The order total is correctly labelled; the EMI panel
         is excluded by keyword. -->
    <div class="order-summary">
      <span>Order Total</span>
      <span class="a-price"
        ><span class="a-price-symbol">₹</span
        ><span class="a-price-whole">32,310<span class="a-price-decimal">.</span></span
        ><span class="a-price-fraction">00</span></span
      >
    </div>
    <div class="emi-panel">
      <p>No Cost EMI available</p>
      <p>Total EMI payable: ₹5,93,990.00 over 24 months</p>
    </div>
    <input type="submit" name="placeYourOrder1" value="Place your order" />
  </body>
</html>
