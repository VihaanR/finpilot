name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Engine + evals (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches services/api/.python-version. Not cosmetic: psycopg-binary
          # and numpy ship no wheels for the newest interpreters, which is what
          # broke the first Render deploy.
          python-version-file: services/api/.python-version
          cache: pip
      - run: pip install -r services/api/requirements.txt
      - run: pytest services/api/tests/ evals/

  web:
    name: Web build + accessibility (axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: services/api/.python-version
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: pip install -r services/api/requirements.txt
      - name: Start the API
        working-directory: services/api
        env:
          ALLOWED_ORIGINS: http://localhost:3000
        run: |
          python -m uvicorn app.main:app --port 8001 &
          # The store self-seeds the demo ledger on a blank disk, so there is
          # nothing to load first — just wait for it to answer.
          for i in $(seq 1 60); do
            curl -sf http://localhost:8001/health && break
            sleep 1
          done
          curl -sf http://localhost:8001/health

      - run: npm ci
        working-directory: apps/web
      - name: Build
        working-directory: apps/web
        env:
          # Baked in at build time, not read at runtime — it has to be set here.
          NEXT_PUBLIC_API_URL: http://localhost:8001
        run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: axe + extension suite
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8001
        # @quota spends Groq/Gemini free-tier requests, so it stays opt-in and
        # never runs on a push.
        run: npx playwright test --grep-invert @quota
