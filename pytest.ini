[pytest]
# `pythonpath` is resolved against rootdir, so `pytest services/api/tests/ -v`
# from the repository root imports `app.engine` without an editable install.
pythonpath = services/api
testpaths = services/api/tests evals
python_files = test_*.py
addopts = -q --strict-markers
markers =
    live: needs a Gemini API key and quota; opt in with --live or --live-all
asyncio_default_fixture_loop_scope = function
